# Render blueprint for the Hearthlog API.
#
# `sync: false` marks a value as one you set in the dashboard rather than
# committing — which is every secret here. MONGODB_URI, in particular, must
# never live in the repo.
services:
  - type: web
    name: hearthlog-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production

      # Behind Render's proxy. Without this, express-rate-limit keys every
      # request to the proxy's IP and secure cookies are never set.
      - key: TRUST_PROXY
        value: 'true'

      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: hearthlog

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: JWT_REFRESH_TTL_MS
        value: '2592000000'

      # Must exactly match the deployed frontend origin — no trailing slash.
      - key: CORS_ORIGIN
        sync: false
