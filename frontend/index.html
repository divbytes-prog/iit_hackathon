<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Hearthlog — a cozy Life RPG for your actual life</title>
    <meta
      name="description"
      content="Hearthlog turns reading, walking, making and tidying into a quiet progression system. Earn experience, grow five attributes, keep a streak, and spend beans on a desk worth sitting at."
    />
    <meta name="author" content="Hearthlog" />
    <meta name="theme-color" content="#fbf6ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a18" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://hearthlog.app/" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hearthlog" />
    <meta property="og:title" content="Hearthlog — a cozy Life RPG for your actual life" />
    <meta
      property="og:description"
      content="A habit tracker that behaves like a game you would actually play. Experience, attributes, streaks and a shelf full of things to buy with coffee beans."
    />
    <meta property="og:url" content="https://hearthlog.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hearthlog — a cozy Life RPG" />
    <meta
      name="twitter:description"
      content="Turn reading, walking, making and tidying into a quiet progression system."
    />

    <!-- Favicon: a lit hearth, drawn inline so there is no extra request -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f6e6de'/%3E%3Cpath d='M16.5 6c.7 3.7-.8 5.7-2.9 7.6-2.5 2.3-4.5 4.5-4.5 8.1a7.4 7.4 0 0 0 14.9 0c0-2.7-1.1-4.7-2.5-6.5-.4 1.3-1.2 2.3-2.4 2.7.8-4.3-.5-8.4-2.6-11.9Z' fill='none' stroke='%23a85f40' stroke-width='1.9' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts. Preconnect first so the handshake overlaps with parsing, and
         display=swap so text is never invisible while they load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data, so a search result shows what this actually is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Hearthlog",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any modern web browser",
        "description": "A cozy Life RPG that turns everyday intentions into a progression system with experience, attributes, streaks and an in-game economy.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Non-linear levelling",
          "Five character attributes",
          "Daily streaks with streak protection",
          "Bean economy and cosmetic shop",
          "Full activity history"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root">
      <!-- Shown until React mounts; replaced on first render. Keeping it
           inline means the page is never blank, even on a slow connection. -->
      <div
        style="
          display: grid;
          place-items: center;
          min-height: 100dvh;
          font-family: ui-sans-serif, system-ui, sans-serif;
          color: #9a8f7e;
          background: #fbf6ee;
        "
      >
        <p style="font-size: 14px">Putting the kettle on…</p>
      </div>
    </div>

    <noscript>
      <div style="padding: 2rem; font-family: ui-sans-serif, system-ui, sans-serif">
        <h1>Hearthlog needs JavaScript</h1>
        <p>
          Hearthlog is a cozy Life RPG that turns everyday intentions — reading, walking,
          making, tidying — into a progression system with experience, attributes and
          streaks. It needs JavaScript enabled to run.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
